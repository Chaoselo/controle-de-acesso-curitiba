[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/og-default.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/solucoes/software-de-gestao/"
  to = "/solucoes/"
  status = 301
  force = true

[[redirects]]
  from = "/solucoes/software-de-gestao"
  to = "/solucoes/"
  status = 301
  force = true

[[redirects]]
  from = "/servicos/modernizacao/"
  to = "/servicos/"
  status = 301
  force = true

[[redirects]]
  from = "/servicos/modernizacao"
  to = "/servicos/"
  status = 301
